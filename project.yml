name: SonAR
options:
  bundleIdPrefix: com.sonar
  createIntermediateGroups: true
targets:
  SonAR:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - App
      - ARBridge
      - Config
      - Core
      - Features
      - GlobalComponents
      - Resources
      - Services
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "SonAR uses the camera to place the ultrasonic sensor in AR."
        SWIFT_VERSION: 5.0
