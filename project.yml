name: SonAR
options:
  bundleIdPrefix: com.sonar
  createIntermediateGroups: true

packages:
  FeedbackRobot:
    path: FeedbackRobot

targets:
  SonAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - ARBridge
      - Config
      - Core
      - Features
      - GlobalComponents
      - Resources
      - Services
    dependencies:
      - package: FeedbackRobot
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.0
